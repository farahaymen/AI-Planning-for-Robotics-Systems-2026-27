# Lab 8, evaluation. The sparse_safe policy on the same held-out seeds.
#
# Identical to ppo_dense.yaml except for the reward the policy was trained on
# and the file it is loaded from. Keeping everything else the same is what makes
# the comparison a comparison.
system_label: ppo_sparse_safe
scenario: training_grammar_seeds_500_529
env_factory: arc_rl.nav_core:FastNavEnv
env_args:
  scenario_factory: arc_rl.arenas:training_scenario
  reward: sparse_safe
  randomise_start: false
policy_factory: starters.lab08.train:make_policy_from
policy_args:
  path: models/ppo_sparse_safe
seeds: [500, 501, 502, 503, 504, 505, 506, 507, 508, 509,
        510, 511, 512, 513, 514, 515, 516, 517, 518, 519,
        520, 521, 522, 523, 524, 525, 526, 527, 528, 529]
max_steps: 900
out: results/ppo_sparse_safe.json
