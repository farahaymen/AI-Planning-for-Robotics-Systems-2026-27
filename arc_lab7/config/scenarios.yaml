# Demonstrator reference for Lab 7, Exercise 7.3. Rotate the scenario between
# sessions so the answer does not travel between groups.
scenarios:
  1: {node: /controller_server, parameter: FollowPath.max_vel_x, value: 0.02,
      symptom: "path plans, robot creeps, progress checker fails",
      diagnosis: "ros2 param get /controller_server FollowPath.max_vel_x"}
  2: {node: /global_costmap/global_costmap, parameter: inflation_layer.inflation_radius,
      value: 0.95, symptom: "no valid path through the doorway",
      diagnosis: "compare inflation radius against the 1.2 m doorway"}
  3: {node: /collision_monitor, parameter: PolygonStop.radius, value: 1.5,
      symptom: "robot refuses to move at all",
      diagnosis: "ros2 topic hz /cmd_vel versus /cmd_vel_smoothed"}
  4: {node: /controller_server, parameter: progress_checker.movement_time_allowance,
      value: 1.0, symptom: "recoveries abandoned partway through",
      diagnosis: "a spin of 1.57 rad takes about 1.6 s plus acceleration"}
  5: {node: /planner_server, parameter: GridBased.tolerance, value: 0.01,
      symptom: "goals near obstacles rejected",
      diagnosis: "ros2 action send_goal with a goal in open space to compare"}
