controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # These two numbers are the single most common source of a robot that
    # "drives but ends up in the wrong place". They must match the URDF exactly.
    wheel_separation: 0.350
    wheel_radius: 0.050

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    open_loop: false
    # NOTE: use_stamped_vel was REMOVED from diff_drive_controller in this
    # version. The controller now subscribes to TwistStamped only, and setting
    # that parameter here was silently ignored. arc_gazebo's cmd_vel_relay
    # converts the unstamped Twist that teleop, Nav2 and the course code all
    # publish. Do not re-add the parameter; it does nothing.

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.50
    linear.x.min_velocity: -0.125
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.80
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 3.0

    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
